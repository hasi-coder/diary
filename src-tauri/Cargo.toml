[package]
name = "my-diary"
version = "0.1.0"
description = "My Diary desktop app"
authors = ["Hasitha Aravinda"]
edition = "2021"
rust-version = "1.77"
default-run = "my-diary"

[lib]
name = "my_diary_lib"
path = "src/lib.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Argon2 is unusably slow without optimisations; keep crypto fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
